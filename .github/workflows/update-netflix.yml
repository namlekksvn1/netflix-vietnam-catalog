name: Update Netflix Vietnam Catalog

on:
  schedule:
    # Tuesday 11:00 Vietnam time = 04:00 UTC
    - cron: "0 4 * * 2"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update Netflix Vietnam catalog
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: namlekksvn1
          GITHUB_REPO: netflix-vietnam-catalog
          GITHUB_BRANCH: main
        run: python main.py
